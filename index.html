<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wizard-n-Which</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="witch" viewBox="0 0 200 240">
      <polygon points="100,10 62,100 138,100" fill="#3b2a8f"/>
      <ellipse cx="100" cy="102" rx="66" ry="10" fill="#3b2a8f"/>
      <g fill="#ffd166">
        <circle cx="95" cy="55" r="3.5"/><circle cx="108" cy="75" r="3.5"/><circle cx="86" cy="88" r="3.5"/>
      </g>
      <circle cx="100" cy="140" r="34" fill="#ffe0bd"/>
      <circle cx="88" cy="136" r="3.5" fill="#222"/>
      <circle cx="112" cy="136" r="3.5" fill="#222"/>
      <path d="M90 151 Q100 159 110 151" stroke="#c0392b" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M100 175 Q60 180 55 232 L145 232 Q140 180 100 175Z" fill="#3b2a8f"/>
      <circle cx="100" cy="182" r="5" fill="#ffd166"/>
    </symbol>
    <symbol id="wizard" viewBox="0 0 200 240">
      <polygon points="100,10 62,100 138,100" fill="#7a1f2b"/>
      <ellipse cx="100" cy="102" rx="66" ry="10" fill="#7a1f2b"/>
      <g fill="#ffd166">
        <circle cx="95" cy="55" r="3.5"/><circle cx="108" cy="75" r="3.5"/><circle cx="86" cy="88" r="3.5"/>
      </g>
      <circle cx="100" cy="140" r="34" fill="#ffe0bd"/>
      <path d="M68 150 Q100 232 132 150 Q100 170 68 150Z" fill="#eee"/>
      <circle cx="88" cy="132" r="3.5" fill="#222"/>
      <circle cx="112" cy="132" r="3.5" fill="#222"/>
      <path d="M92 150 Q100 155 108 150" stroke="#c0392b" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M100 195 Q60 195 55 232 L145 232 Q140 195 100 195Z" fill="#7a1f2b"/>
    </symbol>
  </svg>

  <main>
    <section id="open-screen" data-scene="open">
      <h1>Wizard-n-Which</h1>
      <p class="tagline">Design your witch or wizard. Do good deeds. Find a magical friend.</p>
      <svg class="hero" viewBox="0 0 200 240" role="img" aria-label="A little witch"><use href="#witch"/></svg>
      <button id="start" type="button">Start</button>
      <p id="phone-notice" hidden>This game is played with a keyboard. Please open it on a computer or laptop.</p>
    </section>

    <section id="choice-screen" data-scene="choice" hidden>
      <h2>Who do you want to be?</h2>
      <div class="choices">
        <button class="choice" type="button" data-character="witch">
          <svg viewBox="0 0 200 240" aria-hidden="true"><use href="#witch"/></svg>
          <span>Witch</span>
        </button>
        <button class="choice" type="button" data-character="wizard">
          <svg viewBox="0 0 200 240" aria-hidden="true"><use href="#wizard"/></svg>
          <span>Wizard</span>
        </button>
      </div>
    </section>

    <section id="designer-screen" data-scene="designer" hidden>
      <h2>Make your own!</h2>
      <div class="designer">
        <div id="preview" aria-live="polite"></div>
        <div class="panel">
          <div id="tabs" class="tabs" role="group" aria-label="Categories"></div>
          <div id="options" class="options grid" role="group" aria-label="Choices"></div>
          <div id="swatches" class="swatches" role="group" aria-label="Colours"></div>
        </div>
      </div>
      <div class="actions">
        <button id="surprise" type="button" class="secondary">🎲 Surprise me</button>
        <button id="designer-done" type="button">Done</button>
      </div>
    </section>

    <section id="home-screen" data-scene="home" hidden>
      <canvas id="game" width="960" height="540" aria-label="Your home"></canvas>
      <p class="hint">Move with ← → or A / D</p>
    </section>
  </main>
</body>
</html>
