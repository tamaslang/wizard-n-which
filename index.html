<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wizard-n-Which</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <main id="open-screen">
    <h1>Wizard-n-Which</h1>
    <p class="tagline">Design your witch or wizard. Do good deeds. Find a magical friend.</p>

    <svg class="witch" viewBox="0 0 200 240" role="img" aria-label="A little witch">
      <polygon points="100,10 65,95 135,95" fill="#5b2a86"/>
      <ellipse cx="100" cy="98" rx="62" ry="12" fill="#3d1a5c"/>
      <circle cx="100" cy="135" r="38" fill="#ffd9b3"/>
      <circle cx="87" cy="130" r="4" fill="#222"/>
      <circle cx="113" cy="130" r="4" fill="#222"/>
      <path d="M88 148 Q100 158 112 148" stroke="#c0392b" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M62 135 Q55 175 70 190 M138 135 Q145 175 130 190" stroke="#8b4513" stroke-width="10" fill="none" stroke-linecap="round"/>
      <polygon points="100,170 60,225 140,225" fill="#7a3fb0"/>
      <rect x="75" y="225" width="20" height="10" rx="4" fill="#ff5fa2"/>
      <rect x="105" y="225" width="20" height="10" rx="4" fill="#ff5fa2"/>
    </svg>

    <button id="start" type="button">Start</button>
    <p id="phone-notice" hidden>This game is played with a keyboard. Please open it on a computer or laptop.</p>
  </main>
</body>
</html>
