<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wizard-n-Which</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="witch" viewBox="0 0 200 240">
      <polygon points="100,10 62,100 138,100" fill="#3b2a8f"/>
      <ellipse cx="100" cy="102" rx="66" ry="10" fill="#3b2a8f"/>
      <g fill="#ffd166">
        <circle cx="95" cy="55" r="3.5"/><circle cx="108" cy="75" r="3.5"/><circle cx="86" cy="88" r="3.5"/>
      </g>
      <circle cx="100" cy="140" r="34" fill="#ffe0bd"/>
      <circle cx="88" cy="136" r="3.5" fill="#222"/>
      <circle cx="112" cy="136" r="3.5" fill="#222"/>
      <path d="M90 151 Q100 159 110 151" stroke="#c0392b" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M100 175 Q60 180 55 232 L145 232 Q140 180 100 175Z" fill="#3b2a8f"/>
      <circle cx="100" cy="182" r="5" fill="#ffd166"/>
    </symbol>
    <symbol id="wizard" viewBox="0 0 200 240">
      <polygon points="100,10 62,100 138,100" fill="#7a1f2b"/>
      <ellipse cx="100" cy="102" rx="66" ry="10" fill="#7a1f2b"/>
      <g fill="#ffd166">
        <circle cx="95" cy="55" r="3.5"/><circle cx="108" cy="75" r="3.5"/><circle cx="86" cy="88" r="3.5"/>
      </g>
      <circle cx="100" cy="140" r="34" fill="#ffe0bd"/>
      <path d="M68 150 Q100 232 132 150 Q100 170 68 150Z" fill="#eee"/>
      <circle cx="88" cy="132" r="3.5" fill="#222"/>
      <circle cx="112" cy="132" r="3.5" fill="#222"/>
      <path d="M92 150 Q100 155 108 150" stroke="#c0392b" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M100 195 Q60 195 55 232 L145 232 Q140 195 100 195Z" fill="#7a1f2b"/>
    </symbol>
  </svg>

  <main>
    <section id="open-screen" data-scene="open">
      <h1>Make your own witch or wizard adventures</h1>
      <p class="tagline">Design your witch or wizard. Do good deeds. Find a magical friend.</p>
      <svg class="hero" viewBox="0 0 400 240" role="img" aria-label="A moonlit magical night with two mysterious shadowy figures">
        <defs>
          <radialGradient id="moonGlow"><stop offset="0" stop-color="#fff3b0"/><stop offset="1" stop-color="#fff3b0" stop-opacity="0"/></radialGradient>
          <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a6bd6" stop-opacity="0"/><stop offset="1" stop-color="#8a6bd6" stop-opacity=".75"/></linearGradient>
        </defs>
        <circle cx="200" cy="85" r="85" fill="url(#moonGlow)" opacity=".55"/>
        <circle cx="200" cy="85" r="52" fill="#ffe9a8"/>
        <circle cx="218" cy="72" r="9" fill="#f3d588"/><circle cx="188" cy="102" r="6" fill="#f3d588"/>
        <g fill="#ffd34d">
          <path d="M40 40l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/><path d="M350 30l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
          <path d="M320 120l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/><path d="M85 110l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/>
          <circle cx="120" cy="30" r="2"/><circle cx="290" cy="50" r="2"/><circle cx="25" cy="85" r="2"/><circle cx="375" cy="85" r="2"/>
        </g>
        <path d="M0 200 Q100 165 200 190 T400 185 V240 H0z" fill="#1b1034"/>
        <g fill="#0f0820">
          <g transform="translate(-184 0)"><path d="M276 205 C272 150 280 125 292 112 C288 95 296 90 300 90 C306 90 314 95 308 112 C322 126 326 150 322 205z"/><path d="M276 112 L300 40 L324 112z"/><ellipse cx="300" cy="112" rx="30" ry="6"/></g>
          <path d="M276 205 C272 150 280 125 292 112 C288 95 296 90 300 90 C306 90 314 95 308 112 C322 126 326 150 322 205z"/>
          <path d="M276 112 L300 40 L324 112z"/><ellipse cx="300" cy="112" rx="30" ry="6"/>
        </g>
        <g fill="#b6ff8a"><ellipse cx="108" cy="132" rx="3.5" ry="4.5"/><ellipse cx="124" cy="132" rx="3.5" ry="4.5"/></g>
        <g fill="#7fe3ff"><ellipse cx="292" cy="132" rx="3.5" ry="4.5"/><ellipse cx="308" cy="132" rx="3.5" ry="4.5"/></g>
        <text x="190" y="165" font-size="44" font-weight="800" fill="#ffd34d" opacity=".85" text-anchor="middle" font-family="system-ui,sans-serif">?</text>
        <rect y="150" width="400" height="90" fill="url(#mist)"/>
        <path d="M0 215 Q60 195 130 212 T260 208 T400 214 V240 H0z" fill="#8a6bd6" opacity=".35"/>
      </svg>
      <button id="start" type="button">Start</button>
      <p id="phone-notice" hidden>This game is played with a keyboard. Please open it on a computer or laptop.</p>
    </section>

    <section id="choice-screen" data-scene="choice" hidden>
      <h2>Who do you want to be?</h2>
      <div class="choices">
        <button class="choice" type="button" data-character="witch">
          <span class="choice-art" data-art="witch"></span>
          <span>Witch</span>
        </button>
        <button class="choice" type="button" data-character="wizard">
          <span class="choice-art" data-art="wizard"></span>
          <span>Wizard</span>
        </button>
      </div>
    </section>

    <section id="designer-screen" data-scene="designer" hidden>
      <h2>Make your own!</h2>
      <div class="designer">
        <div id="preview" aria-live="polite"></div>
        <div class="panel">
          <div id="tabs" class="tabs" role="group" aria-label="Categories"></div>
          <div id="options" class="options grid" role="group" aria-label="Choices"></div>
          <div id="swatches" class="swatches" role="group" aria-label="Colours"></div>
        </div>
      </div>
      <div class="actions">
        <button id="surprise" type="button" class="secondary">🎲 Surprise me</button>
        <button id="designer-done" type="button">Done</button>
      </div>
    </section>

    <section id="home-screen" data-scene="home" hidden>
      <canvas id="game" width="960" height="540" aria-label="Your home"></canvas>
      <p class="hint">Move with ← → or A / D · Jump with ↑, W or Space</p>
    </section>
  </main>
</body>
</html>
